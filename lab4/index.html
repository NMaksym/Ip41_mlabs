<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4</title>
</head>

<body>
    <header>
        <h1>Student card FORM</h1>
    </header>
    <main>
        <section>
            <form action="." method="post" enctype="multipart/form-data">

                <h2>Personal Information</h2>

                <fieldset>
                    <legend>Provide your details</legend>

                    <label for="name">Full Name:</label>
                    <input placeholder="Enter your full name" type="text" id="name" name="name" required><br><br>

                    <label for="email">Email:</label>
                    <input placeholder="Enter your email" type="email" id="email" name="email" required><br><br>

                    <label for="password">Password:</label>
                    <input placeholder="Enter your password" type="password" id="password" name="password"
                        required><br><br>

                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required><br><br>

                    <label for="Date of Birth">Date of Birth:</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required><br><br>

                    <label for="gender">Gender:</label><br>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label><br>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label><br>
                    <input type="radio" id="other" name="gender" value="other" required>
                    <label for="other">Other</label><br><br>

                    <label for="Languages Known">Languages Known:</label><br>
                    <input type="checkbox" id="english" name="languages" value="english">
                    <label for="english">English</label><br>
                    <input type="checkbox" id="spanish" name="languages" value="spanish">
                    <label for="spanish">Spanish</label><br>
                    <input type="checkbox" id="french" name="languages" value="french">
                    <label for="french">French</label><br><br>

                    <label for="country">Country:</label>
                    <select id="country" name="country" required>
                        <option value="">Select your country</option>
                        <option value="ukraine">Ukraine</option>
                        <option value="uk">UK</option>
                        <option value="australia">Australia</option>
                    </select><br><br>
                </fieldset>
                <h2>College Subjects</h2>
                <fieldset>
                    <legend>Select your subjects</legend>
                    <label for="Choose subjects">Choose your subjects:</label><br>
                    <select multiple id="subjects" name="subjects[]" required>
                        <option value="math">Math</option>
                        <option value="physics">Physics</option>
                        <option value="chemistry">Chemistry</option>
                        <option value="biology">Biology</option>
                        <option value="history">History</option>
                    </select><br><br>
                    <label for="Rate your interest in Computer Science">Rate your interest in Computer Science</label>
                    <input type="range" id="interest" name="interest" min="1" max="10" required><br><br>
                </fieldset>
                <h2>Skills Assessment</h2>
                <fieldset>
                    <legend>Assess your skills</legend>
                    <label for="skills">Describe your skills:</label><br>
                    <textarea placeholder="List your skills here..." id="skills" name="skills" rows="4" cols="50"
                        required></textarea><br><br>

                    <label for="resume">Upload your resume:</label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br><br>

                    <label for="color">Pick your favorite color:</label>
                    <input type="color" id="color" name="color" required><br><br>

                    <label for="time">Preferred study time:</label>
                    <input type="time" id="time" name="time" required><br><br>
                    <input type="submit" value="Submit Survey">
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; Student card by Maksym. All rights reserved.</p>
    </footer>
</body>

</html>
